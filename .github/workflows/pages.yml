name: Deploy menu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: 檢查並部署
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ---------- 部署前的三道閘門 ----------

      - name: 必要檔案存在
        run: |
          set -euo pipefail
          for f in index.html assets/css/app.css assets/js/app.js .nojekyll; do
            test -e "$f" || { echo "::error::缺少 $f"; exit 1; }
          done

      - name: 沒有簡體字
        run: |
          set -euo pipefail
          python3 tools/check_site.py

      - name: 相對路徑不斷鏈
        run: |
          set -euo pipefail
          python3 tools/check_links.py

      - name: 組合 _site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r index.html assets .nojekyll README.md assistant _site/

      # 擴充功能每次部署都重新打包，避免 repo 裡放著會過期的壓縮檔
      - name: 打包瀏覽器擴充功能
        run: |
          set -euo pipefail
          cd _site/assistant
          zip -qr ai-tutor-extension.zip extension
          unzip -l ai-tutor-extension.zip | head -20

      # ---------- 部署 ----------

      - name: 設定 Pages
        uses: actions/configure-pages@v5
        with:
          # 倉庫還沒開過 Pages 時自動開啟（首次部署會用到）
          enablement: true

      - name: 上傳網站內容
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # artifact 上傳完成後，API 有時還查不到（deploy-pages 會立刻查詢而失敗）
      # 這裡先等到 artifact 真的出現，再交給 deploy-pages。
      - name: 等待 artifact 就緒
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                  --jq '[.artifacts[] | select(.name=="github-pages")] | length')
            echo "第 $i 次查詢：github-pages artifact = $n"
            if [ "$n" -ge 1 ]; then exit 0; fi
            sleep 5
          done
          echo "::error::等不到 github-pages artifact"
          exit 1

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
